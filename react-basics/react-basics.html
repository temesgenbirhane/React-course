<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body{
      font-family: Arial;
      margin-top: 0px;
      margin-bottom: 0px;
    }
    .send-button {
      background-color: green;
      color: white;
      padding: 12px 20px;
      margin-left: 10px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }
    .chat-input {
      padding: 12px 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      flex-grow: 1;
    }
    .chat-input-container {
      display: flex;
      margin-bottom: 60px;
    }
    .app-container {
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .chat-message-user {
      display: flex;
      justify-content: end;
      align-items: start;
    }
    .chat-message-robot {
      display: flex;
      align-items: start;
    }
    .chat-message-text{
      background: rgba(128, 128, 128, 0.148);
      padding: 15px 20px;
      border-radius: 10px;
      margin-right: 10px;
      margin-left: 10px;
      margin-bottom: 20px;
      max-width: 300px;
    }
    .chat-message-profile {
      width: 45px;
    }
    .chat-messages-container {
      flex-grow: 1;
      margin-top: 20px;
      overflow: scroll;
      scrollbar-width: none; 
    }
  </style>
</head>
<body>
  <div class="js-container"></div>

  <!-- React + libraries -->
  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
  <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
  <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
  <script src="https://unpkg.com/supersimpledev/babel.js"></script>

  <script type="text/babel">

    function ChatInput({ chatMessages, setChatMessages }) {  
      // Receives props from App:
      // - chatMessages: current list of messages
      // - setChatMessages: function to update that list (lifting state up)

      const [inputText, setInputText] = React.useState('');
      // Controlled input: React state stores the text typed by the user

      function saveInputText(event) {
        setInputText(event.target.value);
        // Updates inputText on every keystroke
      }

      function sendMessage() {
        // Step 1: Add the user's message
        const newChatMessages = [
          ...chatMessages,   // copy old messages
          {
            message: inputText,
            send: "user",
            id: crypto.randomUUID()
          }
        ];
        setChatMessages(newChatMessages);

        // Step 2: Generate chatbot response using external library
        const response = Chatbot.getResponse(inputText);

        // Step 3: Append chatbot message to the updated list
        setChatMessages([
          ...newChatMessages,
          {
            message: response,
            send: "robot",
            id: crypto.randomUUID()
          }
        ]);

        // Step 4: Clear the input field
        setInputText('');
      }

      return (
        <div className="chat-input-container">
          <input 
            placeholder="input a text here" 
            size="30" 
            onChange={saveInputText} 
            value={inputText}
            className="chat-input"
          />
          <button onClick={sendMessage} className="send-button">send</button>
        </div>
      );
    }

    function ChatMessage({ message, send }) {
      return (
        <div className={send === "user" ? "chat-message-user" : "chat-message-robot"}>
          {send === "robot" && <img src="robot.png" className= "chat-message-profile" />}
          {/* Conditional rendering using logical AND */}
          <div className= "chat-message-text">
            {message}
          </div>

          {send === "user" && <img src="user.png" className= "chat-message-profile" />}
        </div>
      );
    }

    function ChatMessages({ chatMessages }) {
      const chatMessagesRef = React.useRef(null); 
      React.useEffect(()=>{
        const containerElem = chatMessagesRef.current;
        if(containerElem){
          containerElem.scrollTop = containerElem.scrollHeight;
        }
      }, [chatMessages]); // useEffect runs after every render when chatMessages changes. this is called dependency array. if we put an empty array, it runs only once after the first render. if we dont put any array, it runs after every render
      return (
        <div className="chat-messages-container" ref={chatMessagesRef}>
          {chatMessages.map((chatMessage) => {
            // Iterates through all messages and renders a ChatMessage component
            return (
              <ChatMessage
                message={chatMessage.message}
                send={chatMessage.send}
                key={chatMessage.id}
              />
            );
          })}
        </div>
      );
    }

    function App() {
      const [chatMessages, setChatMessages] = React.useState([
        {
          message: "hello chatbot",
          send: "user",
          id: "id1"
        },
        {
          message: "How can i help you",
          send: "robot",
          id: "id2"
        },
        {
          message: "can you get me todays date?",
          send: "user",
          id: "id3"
        },
        {
          message: "Today is september 27",
          send: "robot",
          id: "id4"
        }
      ]);
      // App owns the chatMessages state (lifting state up)

      return (
        <div className="app-container">
          
          {/* Rendering ChatInput and passing props */}

          <ChatMessages chatMessages={chatMessages} />
          <ChatInput 
            chatMessages={chatMessages} 
            setChatMessages={setChatMessages}
          />
        </div>
      );
    }

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);
  </script>
</body>
</html>
